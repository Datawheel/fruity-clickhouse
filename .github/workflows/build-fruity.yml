name: Build and Push fruity-clickHouse image

on:
  push:
    tags:
      - 'fruity-v*.*.*'

env:
  GHCR_PATH: ghcr.io/datawheel/fruity-clickhouse

jobs:
  build:
    name: Build and Push a new image version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout data repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract tag version
      id: vars
      run: echo "VERSION=${GITHUB_REF#refs/tags/fruity-v}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ env.GHCR_PATH }}:${{ env.VERSION }} \
          -t ${{ env.GHCR_PATH }}:latest \
          -f ./fruity/Dockerfile

    - name: Push Docker image
      run: |
        docker push ${{ env.GHCR_PATH }}:${{ env.VERSION }}
        docker push ${{ env.GHCR_PATH }}:latest
